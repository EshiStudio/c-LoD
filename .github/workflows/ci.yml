name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format check
        run: cargo fmt --all -- --check

  clippy:
    name: clippy (deny warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy pedantic (informational)
        env:
          RUSTFLAGS: ""
        run: cargo clippy --all-targets -- -W clippy::pedantic -W clippy::cargo 2>&1 | tail -60 || true

  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Unit + integration tests
        run: cargo test --all-features --workspace
      - name: Doc tests
        run: cargo test --doc

  glsl:
    name: shader validation (glslang)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install glslangValidator
        run: |
          curl -sL -o /tmp/glslang.tar.gz \
            "https://github.com/KhronosGroup/glslang/releases/download/16.6.0/glslang-16.6.0-linux-x86_64-release.tar.gz"
          tar xzf /tmp/glslang.tar.gz -C /tmp
          echo "/tmp/bin" >> "$GITHUB_PATH"
      - name: Validate shaders + chain JSONs
        run: bash scripts/check_glsl.sh
      - name: Pack sanity (unit tests build the real pack zip)
        run: cargo test -p lod pack_builds -- --nocapture

  build:
    name: release build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: liblod.so
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: liblod.dylib
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: lod.dll
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (release, deny warnings)
        run: cargo build --release --all-targets
      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: lod-${{ matrix.target }}
          path: |
            target/release/${{ matrix.artifact }}
            module.json
          if-no-files-found: error

  packaging:
    name: module bundle (CRUSSTY tar.gz)
    needs: [fmt, clippy, test, glsl, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release
      - name: Pack like `crussty module pack`
        run: |
          VERSION=$(python3 -c "import json;print(json.load(open('module.json'))['version'])")
          mkdir -p "dist/lod-v${VERSION}-linux-x64"
          cp target/release/liblod.so "dist/lod-v${VERSION}-linux-x64/"
          cp module.json "dist/lod-v${VERSION}-linux-x64/"
          tar czf "dist/lod-v${VERSION}-linux-x64.tar.gz" -C dist "lod-v${VERSION}-linux-x64"
          ls -la dist/
      - uses: actions/upload-artifact@v4
        with:
          name: crussty-bundle
          path: dist/*.tar.gz
          if-no-files-found: error

  strict:
    name: strictness gate (all green)
    needs: [fmt, clippy, test, glsl, build, packaging]
    runs-on: ubuntu-latest
    steps:
      - name: Everything passed
        run: "echo 'c-LoD CI: all gates green'"
