name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-test-build:
    name: lint + test + build (linux-x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable, clippy + rustfmt)
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          rustup default stable

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit + integration tests
        run: cargo test --all-targets --release

      - name: Release build (module .so)
        run: cargo build --release

      - name: Pack Crussty bundle (crussty-install compatible)
        id: pack
        run: |
          VERSION=$(python3 -c "import json;print(json.load(open('module.json'))['version'])")
          ID=$(python3 -c "import json;print(json.load(open('module.json'))['id'])")
          mkdir -p dist/bundle/${ID}
          cp target/release/lib${ID}.so dist/bundle/${ID}/
          cp module.json dist/bundle/${ID}/
          tar -czf dist/${ID}-v${VERSION}-linux-x64.tar.gz -C dist/bundle .
          echo "bundle=dist/${ID}-v${VERSION}-linux-x64.tar.gz" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Upload module bundle
        uses: actions/upload-artifact@v4
        with:
          name: lod-linux-x64
          path: ${{ steps.pack.outputs.bundle }}
          if-no-files-found: error

      - name: Verify bundle loads (dlopen smoke)
        run: |
          cd /tmp && tar xzf "$GITHUB_WORKSPACE/${{ steps.pack.outputs.bundle }}"
          python3 - <<'EOF'
          import ctypes, glob, json
          so = glob.glob('/tmp/lod/lib*.so')
          assert so, 'no .so in bundle'
          lib = ctypes.CDLL(so[0])
          assert hasattr(lib, 'cplugin_init'), 'cplugin_init export missing'
          manifest = json.load(open('/tmp/lod/module.json'))
          assert manifest['id'] == 'lod'
          print('bundle smoke ok:', so[0])
          EOF

  cross-aarch64:
    name: cross check (aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust + target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-unknown-linux-gnu
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Check aarch64 build
        run: |
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          cargo check --target aarch64-unknown-linux-gnu --all-targets

  e2e:
    name: e2e — real Paper 26.3 boot with the module
    runs-on: ubuntu-latest
    needs: lint-test-build
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Set up Java 25 (Paper 26.3 requirement)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build module
        run: cargo build --release

      - name: Download CRUSSTY runtime + launcher
        run: |
          mkdir -p e2e/launcher e2e/versions e2e/modules/lod
          curl -sSL -o e2e/launcher/launcher.jar \
            "https://github.com/PLANETA9091/CRUSSTY/releases/download/v2.4.1/launcher.jar"
          curl -sSL -o e2e/libcrussty_runtime.so \
            "https://github.com/PLANETA9091/CRUSSTY/releases/download/v2.4.1/libcrussty_runtime.so"

      - name: Download Paper 26.3
        run: |
          J=$(curl -s "https://fill.papermc.io/v3/projects/paper/versions/26.3/builds/latest")
          URL=$(echo "$J" | jq -r '.downloads["server:default"].url')
          echo "paper url: $URL"
          curl -sSL -o e2e/versions/paper-26.3.jar "$URL"

      - name: Assemble server dir
        run: |
          cp target/release/liblod.so e2e/modules/lod/
          cp module.json e2e/modules/lod/
          printf '[server]\nkernel = "paper-26.3.jar"\nmemory = "2G"\n' > e2e/crussty.toml
          echo "eula=true" > e2e/eula.txt
          printf "online-mode=false\nview-distance=8\nlevel-seed=clod-ci\n" > e2e/server.properties

      - name: Boot server (7 min cap) and wait for module markers
        working-directory: e2e
        run: |
          timeout 420 java -jar launcher/launcher.jar --nogui > boot.log 2>&1 || true
          echo "--- module markers ---"
          grep -F "[c-LoD]" boot.log | head -40 || (echo "NO c-LoD OUTPUT"; tail -60 boot.log; exit 1)

      - name: Assert hard gates
        working-directory: e2e
        run: |
          python3 ../scripts/e2e/gates.py boot.log

      - name: Upload boot log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-boot-log
          path: e2e/boot.log
